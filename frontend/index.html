    const id = requestAnimationFrame(() => requestAnimationFrame(() => setOn(true)));
    return () => cancelAnimationFrame(id);
  }, []);
  const st = Object.assign({}, style, on ? to : from, { transition: `all ${dur}s ${EASE} ${delay}s` });
  return React.createElement(as, Object.assign({ className, style: st }, rest), children);
}
function useCountUp(target, { duration=1200, decimals=0, delay=0 } = {}) {
  const [val, setVal] = useState(0);
  useEffect(() => {
    let raf; const t0 = performance.now() + delay;
    const tick = (now) => {
      if (now < t0) { raf = requestAnimationFrame(tick); return; }
      const p = Math.min(1, (now - t0) / duration);
      setVal(target * (1 - Math.pow(1 - p, 3)));
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [target]);
  return decimals ? Number(val.toFixed(decimals)) : Math.round(val);
}
function ExitRow({ exiting, children }) {
  const ref = useRef(null);

    if (exiting && ref.current) {

      return () => cancelAnimationFrame(r1);
    }
  }, [exiting]);
  const style = p
    ? { height:0, opacity:0, transform:'translateX(48px) scale(.98)', overflow:'hidden', marginTop:0, transition:`all .45s ${EASE}` }

  return <div ref={ref} style={style}>{children}</div>;
}

function Ring({ value, size=170, thickness=13, from='#22D3EE', to='#60A5FA', track='rgba(255,255,255,.12)', delay=250, dur=1300, children }) {
  const [v, setV] = useState(0);
  const gid = useMemo(() => 'ring' + Math.random().toString(36).slice(2), []);
  useEffect(() => {
    let raf; const t0 = performance.now() + delay;
    const tick = (now) => {
      if (now < t0) { raf = requestAnimationFrame(tick); return; }
      const p = Math.min(1, (now - t0) / dur);
      setV(value * (1 - Math.pow(1 - p, 3)));
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [value]);
  const r = (size - thickness) / 2, c = 2 * Math.PI * r;
  return (
    <div className="relative shrink-0" style={{ width:size, height:size }}>
      <svg width={size} height={size} className="-rotate-90">
        <defs><linearGradient id={gid} x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stopColor={from}/><stop offset="100%" stopColor={to}/></linearGradient></defs>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={track} strokeWidth={thickness}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={`url(#${gid})`} strokeWidth={thickness} strokeLinecap="round"
          strokeDasharray={c} strokeDashoffset={c - (c * v) / 100}/>
      </svg>
      <div className="absolute inset-0 flex flex-col items-center justify-center text-center">
        {typeof children === 'function' ? children(v) : children}
      </div>
    </div>
  );
}

  return (

}

function LiveFeed() {
  const pool = useMemo(() => [
    { icon:'mail', c:'#2563EB', text:'Email received — freight@nordwind-line.de' },
    { icon:'sparkles', c:'#8B5CF6', text:'EML-1015 classified as BL_COMPARISON (96%)' },
    { icon:'checkCircle', c:'#10B981', text:'EML-1002 verified — all 7 fields match' },
    { icon:'xCircle', c:'#EF4444', text:'EML-1004 mismatch — gross_weight_kg' },
    { icon:'userCheck', c:'#F59E0B', text:'Case #105 escalated to human review' },
    { icon:'scan', c:'#06B6D4', text:'OCR pass complete — SI_4412.pdf (7/7 fields)' },
    { icon:'download', c:'#64748B', text:'submission.json regenerated for evaluation' },
  ], []);
  const [items, setItems] = useState(() => pool.slice(0,4).map((p,i) => ({ ...p, k:i, at: Date.now() - (i+1)*26000 })));
  const idx = useRef(4);
  useEffect(() => {
    const t = setInterval(() => {
      setItems(prev => [{ ...pool[idx.current++ % pool.length], k: Math.random(), at: Date.now() }, ...prev].slice(0,6));
    }, 3400);
    return () => clearInterval(t);
  }, []);
  const ago = (t) => { const s = Math.max(1, Math.round((Date.now()-t)/1000)); return s < 60 ? `${s}s ago` : `${Math.round(s/60)}m ago`; };
  return (
    <div className="space-y-1">
      {items.map(it => (
        <M key={it.k} from={{opacity:0, transform:'translateY(-10px)'}} to={{opacity:1, transform:'none'}} dur={.4}
          className="flex items-start gap-3 rounded-xl px-3 py-2.5 hover:bg-white/5 transition-colors">

            <Icon name={it.icon} size={13.5}/>

          <div className="min-w-0">
            <div className="text-[12px] font-semibold text-white/85 leading-snug">{it.text}</div>
            <div className="text-[10px] text-white/35 mt-0.5">{ago(it.at)}</div>
          </div>
        </M>
      ))}
    </div>
  );
}

/* ================================================================
   src/pages/Emails.tsx — search rebuilt with TextField
   ================================================================ */
function EmailsPage() {
  const { emails, navigate, searchSeed, setSearchSeed, toast } = useApp();
  const [query, setQuery] = useState('');
  const [cat, setCat] = useState('ALL');
  const [quick, setQuick] = useState('ALL');
  const [dateF, setDateF] = useState('ALL');
  const [page, setPage] = useState(1);
  const [sort, setSort] = useState({ key:null, dir:'desc' });
  const PAGE_SIZE = 8;
  useEffect(() => { if (searchSeed) { setQuery(searchSeed); setSearchSeed(''); } }, [searchSeed]);
  useEffect(() => { setPage(1); }, [query, cat, quick, dateF]);

  const filtered = useMemo(() => {
    let list = emails.filter(e => {
      const q = query.toLowerCase();
      if (q && !(e.subject.toLowerCase().includes(q) || e.sender.toLowerCase().includes(q) || e.id.toLowerCase().includes(q))) return false;
      if (cat !== 'ALL' && e.category !== cat) return false;
      if (quick !== 'ALL' && e.status !== quick) return false;
      if (dateF !== 'ALL') {
        const d = ageDays(e);
        if (dateF === 'TODAY' && d > 1) return false;
        if (dateF === '7D' && d > 7) return false;
        if (dateF === '30D' && d > 30) return false;
      }
      return true;
    });
    if (sort.key === 'date') list = [...list].sort((a,b) => sort.dir === 'asc' ? a.date.localeCompare(b.date) || a.time.localeCompare(b.time) : b.date.localeCompare(a.date) || b.time.localeCompare(a.time));
    if (sort.key === 'conf') list = [...list].sort((a,b) => sort.dir === 'asc' ? a.conf - b.conf : b.conf - a.conf);
    return list;
  }, [emails, query, cat, quick, dateF, sort]);

  const pages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  const rows = filtered.slice((page-1)*PAGE_SIZE, page*PAGE_SIZE);
  const toggleSort = (key) => setSort(s => s.key === key ? { key, dir: s.dir === 'asc' ? 'desc' : 'asc' } : { key, dir:'desc' });
  const SORT_ICON = (key) => sort.key === key ? (sort.dir === 'asc' ? 'chevronUp' : 'chevronDown') : 'chevronDown';

  return (
    <div className="space-y-5">
      <div className="flex flex-wrap items-end justify-between gap-4">
        <div className="min-w-0">
          <h1 className="font-display text-[26px] font-bold text-navy-900 tracking-tight">Email Intelligence</h1>
          <p className="text-sm text-slate-400 mt-1">1,250 emails indexed · 340 BL comparison requests · {emails.length} in current view set</p>
        </div>
        <div className="flex items-center gap-2.5">
          <button className="btn-ghost" onClick={() => toast('Export scheduled', 'email_export.csv will download shortly.', 'info')}>
            <Icon name="download" size={15}/>Export CSV
          </button>
          <button className="btn-primary" onClick={() => { toast('Re-queueing emails…', '2 emails sent back to the AI pipeline.', 'ai');
            setTimeout(() => toast('AI re-run complete', '2 emails updated with fresh results.', 'success'), 1400); }}>
            <Icon name="sparkles" size={15}/>Re-run AI
          </button>
        </div>
      </div>

      <div className="card p-4 space-y-3.5">
        <div className="flex flex-wrap items-center gap-3">
          <TextField className="flex-1 min-w-[220px]"
            icon={<Icon name="search" size={15}/>}
            placeholder="Search subject, sender or email ID…"
            value={query} onChange={e => setQuery(e.target.value)}/>
          <div className="flex items-center gap-2 text-[12.5px] font-semibold text-slate-400 shrink-0">
            <Icon name="filter" size={14}/>Filters
          </div>
          <select value={cat} onChange={e => setCat(e.target.value)} className="input w-auto py-2 pr-8 cursor-pointer">
            <option value="ALL">All categories</option>
            {Object.entries(CATEGORIES).map(([k,v]) => <option key={k} value={k}>{v.label}</option>)}
          </select>
          <select value={dateF} onChange={e => setDateF(e.target.value)} className="input w-auto py-2 pr-8 cursor-pointer">
            <option value="ALL">Any date</option><option value="TODAY">Today</option><option value="7D">Last 7 days</option><option value="30D">Last 30 days</option>
          </select>
        </div>
        <div className="flex flex-wrap items-center gap-2">
          {[['ALL','All'],['NEEDS_REVIEW','Needs review'],['MISMATCH','Mismatches'],['OK','Verified'],['ERROR','Errors']].map(([id,label]) => (
            <button key={id} onClick={() => setQuick(id)}
              className={cx('rounded-full px-3.5 py-1.5 text-[12px] font-bold transition-all duration-200 border whitespace-nowrap',
                quick === id ? 'bg-navy-900 text-white border-navy-900 shadow-card' : 'bg-white text-slate-500 border-slate-200 hover:border-brand-300 hover:text-brand-600')}>
              {label}{id !== 'ALL' && <span className="ml-1.5 opacity-60">{emails.filter(e => e.status === id).length}</span>}
            </button>
          ))}
          <span className="ml-auto text-[12px] text-slate-400 font-medium whitespace-nowrap">{filtered.length} result{filtered.length !== 1 ? 's' : ''}</span>
        </div>
      </div>

      <div className="card overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full min-w-[920px]">
            <thead className="bg-slate-50/80 border-b border-slate-100">
              <tr>
                <th className="th">Email ID</th>
                <th className="th">Subject / Sender</th>
                <th className="th">Category</th>
                <th className="th cursor-pointer select-none hover:text-brand-500" onClick={() => toggleSort('conf')}>
                  <span className="inline-flex items-center gap-1">Confidence <Icon name={SORT_ICON('conf')} size={12} className={sort.key !== 'conf' ? 'opacity-30' : ''}/></span>
                </th>
                <th className="th">Status</th>
                <th className="th cursor-pointer select-none hover:text-brand-500" onClick={() => toggleSort('date')}>
                  <span className="inline-flex items-center gap-1">Received <Icon name={SORT_ICON('date')} size={12} className={sort.key !== 'date' ? 'opacity-30' : ''}/></span>
                </th>
                <th className="th text-right">Actions</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-slate-50">
              {rows.map((e, i) => (
                <M key={`${page}-${e.id}`} as="tr" from={{opacity:0, transform:'translateY(10px)'}} to={{opacity:1, transform:'none'}} dur={.4} delay={i*0.045}
                  onClick={() => navigate('detail', e.id)}
                  className="group cursor-pointer hover:bg-brand-50/40">
                  <td className="px-4 py-3.5 font-mono text-[12.5px] font-semibold text-brand-600 whitespace-nowrap">{e.id}</td>
                  <td className="px-4 py-3.5">
                    <div className="flex items-center gap-3 min-w-0">
                      <span className="w-8 h-8 rounded-lg bg-gradient-to-br from-navy-100 to-slate-100 text-navy-700 text-[11px] font-bold flex items-center justify-center shrink-0">
                        {e.from.split(' ').map(w => w[0]).slice(0,2).join('')}
                      </span>
                      <div className="min-w-0">
                        <div className="text-[13px] font-semibold text-ink-800 truncate max-w-[300px] group-hover:text-brand-600 transition-colors">{e.subject}</div>
                        <div className="text-[11.5px] text-slate-400 truncate max-w-[300px]">{e.from}</div>
                      </div>
                    </div>
                  </td>
                  <td className="px-4 py-3.5"><CategoryBadge cat={e.category}/></td>
                  <td className="px-4 py-3.5"><ConfBar v={e.conf}/></td>
                  <td className="px-4 py-3.5"><StatusBadge status={e.status}/></td>
                  <td className="px-4 py-3.5">
                    <div className="text-[12.5px] font-semibold text-ink-700 whitespace-nowrap">{e.date}</div>
                    <div className="text-[11px] text-slate-400">{e.time}</div>
                  </td>
                  <td className="px-4 py-3.5">
                    <div className="flex items-center justify-end gap-1 opacity-40 group-hover:opacity-100 transition-opacity">
                      <button className="w-8 h-8 rounded-lg hover:bg-brand-50 text-slate-400 hover:text-brand-600 flex items-center justify-center transition-colors" title="View analysis">
                        <Icon name="eye" size={15}/>
                      </button>
                      <button className="w-8 h-8 rounded-lg hover:bg-slate-100 text-slate-400 hover:text-ink-700 flex items-center justify-center transition-colors" title="Open source"
                        onClick={ev => { ev.stopPropagation(); toast('Source viewer', 'Raw email & attachments open here in the full build.', 'info'); }}>
                        <Icon name="externalLink" size={15}/>
                      </button>
                    </div>
                  </td>
                </M>
              ))}
            </tbody>
          </table>
        </div>

        {filtered.length === 0 &&
          <EmptyState icon="search" tint="#64748B" title="No emails match your filters"
            sub="Try a different search term or clear the active filters to see the full inbox."
            action={<button className="btn-ghost" onClick={() => { setQuery(''); setCat('ALL'); setQuick('ALL'); setDateF('ALL'); }}>
              <Icon name="refresh" size={15}/>Clear all filters</button>}/>}

        {filtered.length > 0 &&
          <div className="flex flex-wrap items-center justify-between gap-3 px-4 py-3.5 border-t border-slate-100 bg-slate-50/50">
            <span className="text-[12px] text-slate-400 font-medium whitespace-nowrap">
              Showing {(page-1)*PAGE_SIZE + 1}–{Math.min(page*PAGE_SIZE, filtered.length)} of {filtered.length}
            </span>
            <div className="flex items-center gap-1.5">
              <button disabled={page === 1} onClick={() => setPage(page-1)} className="w-8 h-8 rounded-lg border border-slate-200 bg-white flex items-center justify-center text-slate-500 hover:border-brand-300 hover:text-brand-600 disabled:opacity-40 disabled:pointer-events-none transition-all">
                <Icon name="chevronLeft" size={14}/>
              </button>
              {Array.from({ length: pages }, (_,i) => i+1).map(p => (
                <button key={p} onClick={() => setPage(p)}
                  className={cx('w-8 h-8 rounded-lg text-[12.5px] font-bold transition-all',
                    p === page ? 'bg-navy-900 text-white shadow-card' : 'text-slate-500 hover:bg-slate-100')}>{p}</button>
              ))}
              <button disabled={page === pages} onClick={() => setPage(page+1)} className="w-8 h-8 rounded-lg border border-slate-200 bg-white flex items-center justify-center text-slate-500 hover:border-brand-300 hover:text-brand-600 disabled:opacity-40 disabled:pointer-events-none transition-all">
                <Icon name="chevronRight" size={14}/>
              </button>
            </div>
          </div>}
      </div>
    </div>
  );
}

const DOC_TONE = { SI:{ c:'#06B6D4' }, BL:{ c:'#2563EB' } };
function DocumentCard({ d, expanded, onToggle }) {
  const tone = DOC_TONE[d.type] || DOC_TONE.BL;
  const ok = d.status === 'extracted';
  return (
    <button onClick={onToggle} className="relative w-full text-left rounded-2xl border p-4 overflow-hidden group transition-all duration-300 hover:shadow-card hover:-translate-y-0.5"
      style={{ borderColor: tone.c + '30', background: tone.c + '08' }}>
      <div className="absolute left-0 right-0 h-12 animate-scan pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity"
        style={{ background:'linear-gradient(180deg,transparent,rgba(34,211,238,.22),transparent)' }}/>
      <div className="flex items-start gap-3 min-w-0">
        <span className="w-10 h-10 rounded-xl flex items-center justify-center shrink-0" style={{ background:tone.c+'18', color:tone.c }}>
          <Icon name="fileText" size={18}/>
        </span>
        <div className="min-w-0 flex-1">
          <div className="text-[13px] font-bold text-ink-800 font-mono truncate">{d.name}</div>
          <div className="flex flex-wrap items-center gap-x-2.5 gap-y-1 mt-1">
            <span className="rounded-md px-1.5 py-0.5 text-[10px] font-bold tracking-wide shrink-0" style={{ background:tone.c+'18', color:tone.c }}>{d.type}</span>
            <span className="text-[11px] text-slate-400 shrink-0">{d.size}</span>
            {ok
              ? <span className="inline-flex items-center gap-1 text-[11px] font-bold text-emerald-600 whitespace-nowrap"><Icon name="checkCircle" size={11} className="shrink-0"/>{d.fields}/7 fields extracted</span>
              : <span className="inline-flex items-center gap-1 text-[11px] font-bold text-red-500 whitespace-nowrap"><Icon name="alertCircle" size={11} className="shrink-0"/>Extraction failed</span>}
          </div>
        </div>
        <Icon name={expanded ? 'chevronUp' : 'chevronDown'} size={15} className="text-slate-300 group-hover:text-slate-500 transition-colors shrink-0 mt-1"/>
      </div>
      {expanded && d.excerpt &&
        <div className="mt-3.5 rounded-xl bg-white/80 border border-slate-100 p-3 font-mono text-[11px] leading-relaxed space-y-1">
          {d.excerpt.map((l,i) => <div key={i} className={l.includes('—') || l.includes('failed') || l.includes('???') ? 'text-red-500' : 'text-slate-500'}>{l}</div>)}
        </div>}
      {expanded && !d.excerpt &&
        <div className="mt-3.5 rounded-xl bg-white/80 border border-slate-100 p-3 text-[11.5px] text-slate-400">
          Structured extraction complete — all seven shipment fields were normalized to the canonical schema.
        </div>}
    </button>
  );
}
function ComparisonTable({ si, bl, defects }) {
  return (
    <div className="rounded-2xl border border-slate-100 overflow-hidden">
      <div className="grid items-center gap-2 px-4 py-2.5 bg-slate-50/80 border-b border-slate-100 text-[10.5px] font-bold uppercase tracking-wider text-slate-400"
        style={{ gridTemplateColumns:'minmax(130px,1.25fr) 1fr 30px 1fr 86px' }}>
        <span>Field</span><span>SI (source)</span><span/>
        <span>Draft BL</span><span className="text-center">Result</span>
      </div>
      {FIELDS.map(f => {
        const defect = defects.includes(f.key);
        return (
          <div key={f.key}
            className={cx('grid items-center gap-2 px-4 py-3 border-b border-slate-50 last:border-0 transition-colors', defect ? 'bg-red-50/60' : 'hover:bg-slate-50/60')}
            style={{ boxShadow: defect ? 'inset 3px 0 0 #EF4444' : 'inset 3px 0 0 transparent' }}>
            <div className="flex items-center gap-2 min-w-0">
              <Icon name={f.icon} size={14} className={defect ? 'text-red-400 shrink-0' : 'text-slate-300 shrink-0'} strokeWidth={2.2}/>
              <span className={cx('text-[12.5px] font-bold truncate', defect ? 'text-red-900' : 'text-ink-700')}>{f.label}</span>
            </div>
            <span className="font-mono text-[12px] px-2 py-1 rounded-lg truncate min-w-0"
              style={defect ? { background:'#FEF2F2', color:'#B91C1C' } : { background:'#F1F5F9', color:'#334155' }}>
              {valFmt(f.key, si[f.key])}
            </span>
            <Icon name="arrowRight" size={13} className="text-slate-300 shrink-0"/>
            <span className="font-mono text-[12px] px-2 py-1 rounded-lg truncate min-w-0"
              style={defect ? { background:'#FEF2F2', color:'#B91C1C', outline:'1.5px dashed #FCA5A5', outlineOffset:'-1.5px' } : { background:'#F1F5F9', color:'#334155' }}>
              {valFmt(f.key, bl[f.key])}
            </span>
            <div className="flex justify-center">
              {defect

function DecisionBanner({ status, defects }) {
  const map = {
    OK:           { icon:'checkCircle', t:'All seven fields match', s:'No mismatch detected — safe to release the draft BL.', bg:'#ECFDF5', bd:'#A7F3D0', fg:'#065F46' },
    MISMATCH:     { icon:'xCircle', t:`${defects.length} field${defects.length > 1 ? 's' : ''} require correction`, s:'The draft BL deviates from the SI. Correct before issue.', bg:'#FEF2F2', bd:'#FECACA', fg:'#991B1B' },

      </div>
    </div>
  );
}

function DetailTimeline({ email }) {
  const failed = email.status === 'ERROR';
  const steps = [
    { label:'Email received', sub:`${email.date} · ${email.time}`, icon:'mail', state:'done' },
    { label:'Classified as ' + email.category, sub:`confidence ${Math.round(email.conf*100)}%`, icon:'sparkles', state:'done' },
    { label:'Documents located', sub:`${email.atts.length} attachment${email.atts.length !== 1 ? 's' : ''}`, icon:'files', state:'done' },
    { label:'Field extraction & normalization', sub: failed ? 'failed — attachment corrupted' : '7-field canonical schema', icon:'scan', state: failed ? 'fail' : 'done' },
    { label:'SI ↔ BL comparison', sub: failed ? 'not reached' : email.defectFields.length ? `${email.defectFields.length} defect(s) found` : 'all fields equal', icon:'gitCompare', state: failed ? 'pending' : 'done' },
    { label:'Decision: ' + email.status, sub:'decision engine', icon:'shieldCheck', state:'final' },
  ];
  const nodeStyle = (s) => s === 'fail' ? { bg:'#FEE2E2', fg:'#DC2626', icon:'xCircle' }
    : s === 'pending' ? { bg:'#F1F5F9', fg:'#94A3B8', icon:'clock' }
    : s === 'final' ? { bg:(STATUS[email.status].color)+'18', fg:STATUS[email.status].color, icon:STATUS[email.status].icon }
    : { bg:'#ECFDF5', fg:'#059669', icon:'check' };
  return (
    <div className="relative pl-1">
      {steps.map((s, i) => {
        const n = nodeStyle(s.state);
        return (
          <div key={i} className="relative flex gap-3.5 pb-5 last:pb-0">
            {i < steps.length - 1 && <div className={cx('absolute left-[15px] top-8 bottom-0 w-[2px] rounded pointer-events-none', s.state === 'done' ? 'bg-emerald-200' : 'bg-slate-100')}/>}
            <span className="relative w-8 h-8 rounded-full flex items-center justify-center shrink-0 z-10" style={{ background:n.bg, color:n.fg }}>
              <Icon name={n.icon} size={13.5} strokeWidth={2.4}/>
            </span>
            <div className="pt-1 min-w-0">
              <div className={cx('text-[12.5px] font-bold', s.state === 'fail' ? 'text-red-600' : s.state === 'pending' ? 'text-slate-400' : 'text-ink-800')}>{s.label}</div>
              <div className="text-[11px] text-slate-400 mt-0.5">{s.sub}</div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function ReviewCard({ c, onAct }) {
  const { emails } = useApp();
  const email = emails.find(e => e.id === c.emailId);
  const reason = REASONS[c.reason] || REASONS.manual;
  const [open, setOpen] = useState(true);
  const [editing, setEditing] = useState(false);
  const [vals, setVals] = useState(() => Object.fromEntries((c.editFields || []).map(f => [f.key, f.value])));
  const [retrying, setRetrying] = useState(false);
  const [retries, setRetries] = useState(0);

  const doRetry = () => {
    setRetrying(true);
    setTimeout(() => {
      setRetrying(false); setRetries(r => r+1);
      if (c.reason === 'missing_value') onAct(c.id, 'retry-ok');
      else window.dispatchEvent(new CustomEvent('nooutput-retry-failed', { detail:{ id:c.id, reason:c.reason } }));
    }, 1800);
  };

  return (
    <div className="card overflow-hidden hover:shadow-lift transition-shadow">
      <button onClick={() => setOpen(!open)} className="w-full flex items-center gap-3 p-5 text-left">
        <span className="rounded-xl bg-gradient-to-br from-amber-400 to-orange-500 text-white text-[12.5px] font-bold px-3 py-1.5 shadow-[0_6px_18px_-6px_rgba(245,158,11,.6)] shrink-0 whitespace-nowrap">
          Case #{c.id}
        </span>
        <span className="inline-flex items-center gap-1.5 rounded-lg px-2.5 py-1.5 text-[11.5px] font-bold shrink-0 whitespace-nowrap" style={{ background:reason.bg, color:reason.color }}>
          <Icon name={reason.icon} size={12.5} className="shrink-0"/>{reason.label}
        </span>
        <div className="hidden md:block min-w-0 flex-1">
          <div className="text-[12.5px] font-semibold text-slate-400 truncate">{email ? email.subject : c.emailId}</div>
        </div>
        <div className="ml-auto flex items-center gap-3 shrink-0">
          <Ring value={c.confidence} size={46} thickness={5.5} from={c.confidence < 65 ? '#EF4444' : '#F59E0B'} to={c.confidence < 65 ? '#F59E0B' : '#FBBF24'} track="#F1F5F9" delay={300}>
            {() => <span className="text-[10.5px] font-bold text-navy-900">{c.confidence}%</span>}
          </Ring>
          <span className="hidden sm:block text-[10.5px] font-bold text-slate-400 uppercase tracking-wide whitespace-nowrap">{c.received}</span>
          <Icon name={open ? 'chevronUp' : 'chevronDown'} size={16} className="text-slate-300 shrink-0"/>
        </div>
      </button>

      {open && (
        <div className="px-5 pb-5 border-t border-slate-100 pt-4 animate-pageIn">
          <p className="text-[13px] text-slate-500 leading-relaxed">{c.summary}</p>

          <div className="grid md:grid-cols-2 gap-3 mt-4">
            {c.evidence.map(ev => {
              const tone = ev.tone === 'ok' ? { b:'#A7F3D0', bg:'#F0FDF4', chip:'bg-emerald-500/10 text-emerald-600', ic:'checkCircle' }
                : ev.tone === 'warn' ? { b:'#FDE68A', bg:'#FFFBEB', chip:'bg-amber-500/10 text-amber-600', ic:'alertTriangle' }
                : { b:'#FECACA', bg:'#FEF2F2', chip:'bg-red-500/10 text-red-600', ic:'alertTriangle' };
              return (
                <div key={ev.doc} className="rounded-xl border p-3.5 min-w-0" style={{ borderColor:tone.b, background:tone.bg }}>
                  <div className="flex items-center justify-between mb-2 gap-2">
                    <span className={cx('rounded-md px-2 py-0.5 text-[10.5px] font-bold shrink-0', tone.chip)}>{ev.doc} document</span>
                    <Icon name={tone.ic} size={14} className="text-slate-400 shrink-0"/>
                  </div>
                  <div className="font-mono text-[11px] leading-relaxed space-y-1 overflow-hidden">
                    {ev.lines.map((l,i) => <div key={i} className="text-slate-500 break-words">{l}</div>)}
                  </div>
                </div>
              );
            })}
          </div>

          <div className="mt-4 flex items-start gap-2.5 rounded-xl bg-brand-50/70 border border-brand-100 px-3.5 py-3">
            <Icon name="sparkles" size={14} className="text-brand-500 mt-0.5 shrink-0"/>
            <p className="text-[12.5px] text-brand-800 font-medium">{c.suggestion}</p>
          </div>

          {editing &&
            <div className="mt-4 rounded-xl border border-brand-100 bg-brand-50/60 p-4 animate-popIn">
              <div className="text-[11px] font-bold text-brand-700 uppercase tracking-wider mb-3">Correction — confirm values from source</div>
              {(c.editFields || []).map(f => (
                <div key={f.key} className="flex flex-wrap items-center gap-3 mb-2.5">
                  <label className="w-44 text-[12.5px] font-semibold text-ink-700">{f.label}</label>
                  <input value={vals[f.key]} onChange={e => setVals({ ...vals, [f.key]: e.target.value })}
                    className="input py-1.5 w-40 font-mono text-[12.5px]"/>
                  <span className="text-[11px] text-slate-400">SI: {f.si} · BL: {f.bl}</span>
                </div>))}
              <div className="flex gap-2 mt-3">
                <button className="btn-primary btn-sm" onClick={() => onAct(c.id, 'correct')}><Icon name="check" size={13}/>Save &amp; resolve</button>
                <button className="btn-ghost btn-sm" onClick={() => setEditing(false)}>Cancel</button>
              </div>
            </div>}

          <div className="mt-4 grid md:grid-cols-[1fr_250px] gap-5">
            <div className="flex flex-wrap items-center gap-2.5 content-start">
              <button className="btn-emerald" onClick={() => onAct(c.id, 'approve')}><Icon name="check" size={15}/>Approve</button>
              <button className="btn-primary" disabled={!(c.editFields || []).length}
                title={(c.editFields || []).length ? '' : 'Nothing to correct — attach the missing document instead'}
                onClick={() => setEditing(true)}><Icon name="pencil" size={14}/>Correct</button>
              <button className="btn-danger-o" onClick={() => onAct(c.id, 'reject')}><Icon name="x" size={14}/>Reject</button>
              <button className="btn-ghost" onClick={doRetry} disabled={retrying}>
                {retrying ? <Icon name="loader" size={14} className="animate-spin"/> : <Icon name="rotateCcw" size={14}/>}
                {retrying ? 'Re-processing…' : 'Retry' + (retries ? ` (${retries})` : '')}
              </button>
              {retries > 0 && !retrying && c.reason !== 'missing_value' &&
                <span className="text-[11.5px] font-semibold text-red-500 flex items-center gap-1"><Icon name="alertCircle" size={12} className="shrink-0"/>Retry failed — issue persists</span>}
            </div>
            <div>
              {c.timeline.map((t,i) => (
                <div key={i} className="relative flex gap-3 pb-3 last:pb-0">
                  {i < c.timeline.length - 1 && <div className="absolute left-[11px] top-6 bottom-0 w-[2px] rounded bg-slate-100 pointer-events-none"/>}
                  <span className={cx('relative w-6 h-6 rounded-full flex items-center justify-center shrink-0 z-10',
                    t.state === 'active' ? 'bg-amber-100 text-amber-600' : 'bg-emerald-50 text-emerald-600')}>
                    <Icon name={t.icon} size={11.5} strokeWidth={2.4}/>
                  </span>
                  <div className="pt-0.5 min-w-0">
                    <div className="text-[12px] font-semibold text-ink-700 leading-tight">{t.label}</div>
                    {t.t && <div className="text-[10.5px] text-slate-400 mt-0.5">{t.t}</div>}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
function ReviewsPage() {
  const { reviews, setReviews, updateEmail, navigate, restoreReviews, toast } = useApp();
  const [exiting, setExiting] = useState(null);

  useEffect(() => {
    const h = (e) => toast('Retry failed', `Case #${e.detail.id}: the ${e.detail.reason.replace('_',' ')} issue persists after re-processing.`, 'danger');
    window.addEventListener('nooutput-retry-failed', h);
    return () => window.removeEventListener('nooutput-retry-failed', h);
  }, []);

  const act = (id, type) => {
    setExiting({ id, type });
    setTimeout(() => {
      const c = reviews.find(r => r.id === id);
      setReviews(rs => rs.filter(r => r.id !== id));
      setExiting(null);
      if (!c) return;
      if (type === 'approve') { updateEmail(c.emailId, { status:'REVIEWED' }); toast('Case #' + id + ' approved', 'Final result recorded and synced to the report.', 'success'); }
      if (type === 'reject')  { updateEmail(c.emailId, { status:'REJECTED' }); toast('Case #' + id + ' rejected', 'The AI result was overruled by the reviewer.', 'warn'); }
      if (type === 'correct') { updateEmail(c.emailId, { status:'OK' }); toast('Values corrected', 'Comparison re-issued as OK with reviewer overrides.', 'success'); }
      if (type === 'retry-ok'){ updateEmail(c.emailId, { status:'OK' }); toast('Retry succeeded', 'Recovered data allowed a confident decision — case resolved.', 'ai'); }
    }, 500);
  };

  return (
    <div className="space-y-5">
      <div className="flex flex-wrap items-end justify-between gap-4">
        <div className="min-w-0">
          <h1 className="font-display text-[26px] font-bold text-navy-900 tracking-tight">AI Review Queue</h1>
          <p className="text-sm text-slate-400 mt-1">Cases the engine escalated for human judgment · avg. SLA 2.4h</p>
        </div>
        <div className="flex items-center gap-2.5">

          </span>
          <button className="btn-ghost" onClick={() => navigate('emails')}><Icon name="inbox" size={15}/>All emails</button>

      </div>

      <div className="grid grid-cols-1 xl:grid-cols-12 gap-5 items-start">
        <div className="xl:col-span-8 space-y-4">
          {reviews.length === 0 ? (
            <div className="card">
              <EmptyState icon="shieldCheck" tint="#10B981" title="No documents awaiting review"
                sub="The queue is clear — every escalation has been resolved. New cases will appear here the moment the AI needs a human."
                action={<button className="btn-ghost" onClick={() => { restoreReviews(); toast('Queue restored', 'Demo review cases re-loaded.', 'info'); }}>
                  <Icon name="refresh" size={15}/>Restore demo queue</button>}/>

          ) : reviews.map(c => (
            <ExitRow key={c.id} exiting={exiting && exiting.id === c.id}>

          ))}

        <div className="xl:col-span-4 space-y-5">
          <M from={{opacity:0, y:16}} to={{opacity:1, y:0}} delay={.15} className="card p-5">
            <h3 className="font-bold text-[14.5px] text-navy-900 mb-3.5">Why cases escalate</h3>
            <div className="space-y-2.5">
              {Object.entries(REASONS).filter(([k]) => k !== 'manual').map(([k, r]) => {
                const n = reviews.filter(x => x.reason === k).length;
                return (
                  <div key={k} className="flex items-center gap-3 min-w-0">
                    <span className="w-8 h-8 rounded-lg flex items-center justify-center shrink-0" style={{ background:r.bg, color:r.color }}>
                      <Icon name={r.icon} size={14}/>
                    </span>
                    <span className="text-[12.5px] font-semibold text-ink-700 flex-1 truncate">{r.label}</span>
                    <span className={cx('text-[12px] font-bold tabular-nums shrink-0', n ? 'text-navy-900' : 'text-slate-300')}>{n}</span>
                  </div>
                );
              })}
            </div>
            <p className="text-[11.5px] text-slate-400 leading-relaxed mt-4 pt-3.5 border-t border-slate-100">
              The engine never guesses. When confidence drops below the threshold or inputs are unusable, it escalates with full evidence — never failing silently.
            </p>
          </M>
          <M from={{opacity:0, y:16}} to={{opacity:1, y:0}} delay={.22} className="card p-5">
            <h3 className="font-bold text-[14.5px] text-navy-900 mb-4">Reviewer SLA distribution</h3>
            {[['Under 1h',42,'#10B981'],['1 – 4h',35,'#2563EB'],['Over 4h',23,'#F59E0B']].map(([l,v,c]) => (
              <div key={l} className="mb-3 last:mb-0">
                <div className="flex items-center justify-between text-[11.5px] font-semibold text-slate-500 mb-1.5"><span>{l}</span><span>{v}%</span></div>
                <div className="h-2 rounded-full bg-slate-100 overflow-hidden">
                  <M from={{width:'0%'}} to={{width:v+'%'}} dur={.9} delay={.4}
                    className="h-full rounded-full" style={{ background:c }}/>
                </div>
              </div>
            ))}
          </M>
          <M from={{opacity:0, y:16}} to={{opacity:1, y:0}} delay={.3} className="rounded-2xl p-5 text-white relative overflow-hidden" style={{ background:'linear-gradient(135deg,#1E293B,#0F172A)' }}>
            <div className="absolute -right-6 -bottom-8 opacity-[.07] pointer-events-none"><Icon name="code" size={130}/></div>
            <div className="relative">
              <div className="text-[10.5px] font-bold uppercase tracking-[0.14em] text-aqua-300 mb-2.5">Pro tip</div>
              <p className="text-[13px] leading-relaxed text-white/80">Review decisions feed back into evaluation scoring. Consistent, evidence-based approvals raise your <span className="font-bold text-white">Review Reliability</span> metric.</p>
            </div>
          </M>
        </div>
      </div>
    </div>
  );
}

const EVAL_STEPS = [
  { label:'Ingesting inbox dataset', sub:'14 emails · 23 attachments', icon:'inbox', dur:750 },
  { label:'Classifying emails', sub:'5-category taxonomy', icon:'sparkles', dur:1000 },
  { label:'Extracting SI / BL fields', sub:'7-field canonical schema', icon:'scan', dur:1100 },
  { label:'Running comparisons', sub:'normalize → exact → semantic', icon:'gitCompare', dur:1000 },
  { label:'Scoring vs reference set', sub:'private evaluation endpoint', icon:'gauge', dur:950 },
];
function SubmissionPreview() {
  const L = ({ k, v, c }) => <div className="flex"><span className="text-slate-500">{k}</span><span className={c}>{v}</span></div>;
  return (
    <pre className="font-mono text-[11.5px] leading-[1.75] overflow-x-auto">
      <L k="{" v="" c=""/>
      <L k={'  "EML-1001": {'} v="" c=""/>
      <L k={'    "category": '} v={'"BL_COMPARISON",'} c="text-aqua-300"/>
      <L k={'    "has_defect": '} v="true," c="text-amber-300"/>
      <L k={'    "defect_fields": ['} v={'"container_count"'} c="text-amber-300"/>
      <L k={'    ]'} v="" c=""/>
      <L k={'  },'} v="" c=""/>
      <L k={'  "EML-1002": {'} v="" c=""/>
      <L k={'    "category": '} v={'"BL_COMPARISON",'} c="text-aqua-300"/>
      <L k={'    "has_defect": '} v="false" c="text-emerald-300"/>
      <L k={'  },'} v="" c=""/>
      <div className="text-slate-500">  … 12 more entries</div>
      <L k="}" v="" c=""/>
    </pre>
  );
}
function LiveSubmissionPreview({ data }) {
  const L = ({ k, v, c }) => <div className="flex"><span className="text-slate-500">{k}</span><span className={c}>{v}</span></div>;
  const entries = Object.entries(data || {});
  const shown = entries.slice(0, 2);
  return (
    <pre className="font-mono text-[11.5px] leading-[1.75] overflow-x-auto">
      <L k="{" v="" c=""/>
      {shown.map(([id, rec], i) => (
        <React.Fragment key={id}>
          <L k={`  "${id}": {`} v="" c=""/>
          <L k={'    "category": '} v={`"${rec.category}",`} c="text-aqua-300"/>
          <L k={'    "status": '} v={`"${rec.status}",`} c={rec.status === 'MISMATCH' ? 'text-amber-300' : rec.status === 'NEEDS_REVIEW' ? 'text-rose-300' : 'text-emerald-300'}/>
          <L k={'    "has_defect": '} v={rec.has_defect ? 'true,' : 'false,'} c={rec.has_defect ? 'text-amber-300' : 'text-emerald-300'}/>
          <L k={'    "defect_fields": '} v={JSON.stringify(rec.defect_fields || [])} c="text-amber-300"/>
          <L k={i === shown.length - 1 ? '  }' : '  },'} v="" c=""/>
        </React.Fragment>
      ))}
      {entries.length > shown.length && (
        <div className="text-slate-500">  … {entries.length - shown.length} more entries</div>
      )}
      <L k="}" v="" c=""/>
    </pre>
  );
}
function EvaluationPage() {
  const { emails, toast, liveMode, authToken } = useApp();
  const [phase, setPhase] = useState('idle');
  const [step, setStep] = useState(-1);
  const [mode, setMode] = useState('demo');       // 'demo' | 'scored' | 'local'
  const [scoreData, setScoreData] = useState(null);
  const [localSummary, setLocalSummary] = useState(null);
  const [submissionData, setSubmissionData] = useState(null);

  const run = async () => {
    setPhase('run'); setStep(0);
    let acc = 0;
    EVAL_STEPS.forEach((s, i) => {
      acc += s.dur;
      setTimeout(() => setStep(i + 1), acc);
    });
    const minWait = new Promise(r => setTimeout(r, acc + 300));

    if (liveMode && authToken) {
      let scoreResp = null;
      let submission = null;
      try { await apiPost('/evaluation/generate', authToken); } catch (e) { /* non-fatal */ }
      try { scoreResp = await apiPost('/evaluation/submit', authToken); } catch (e) { /* eval server likely unreachable */ }
      try { submission = await apiGet('/evaluation/submission', authToken); } catch (e) { /* ignore */ }
      await minWait;
      setPhase('done');
      setSubmissionData(submission);
      if (scoreResp && typeof scoreResp.final_score === 'number') {
        setMode('scored'); setScoreData(scoreResp);
        toast('Evaluation complete', `Scored ${(scoreResp.final_score * 100).toFixed(1)}% against the reference set.`, 'ai');
      } else {
        setMode('local'); setLocalSummary(buildLocalSummary(emails));
        toast('Reference server unavailable', 'Showing a local pipeline summary instead — the official score needs the organizers\u2019 evaluation server (EVAL_SERVER_URL).', 'info');
      }
    } else {
      await minWait;
      setPhase('done'); setMode('demo');
      toast('Evaluation complete', 'Scored 87.5% against the private reference set.', 'ai');
    }
  };

  const download = () => {
    let data = submissionData;
    if (!data) {
      data = {};
      emails.filter(e => e.category === 'BL_COMPARISON').forEach(e => {
        data[e.id] = { category: e.category, status: e.status, review_reason: e.reviewReason || null,
          has_defect: e.status === 'MISMATCH', defect_fields: e.defectFields };
      });
    }
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'submission.json'; a.click();
    URL.revokeObjectURL(a.href);
    toast('submission.json downloaded', liveMode ? 'Real generated submission.' : 'Ready to POST to /evaluation/submit.', 'success');
  };
  const copy = () => {
    if (navigator.clipboard) navigator.clipboard.writeText(JSON.stringify({ EML_1001:{ category:'BL_COMPARISON', has_defect:true, defect_fields:['container_count'] }}, null, 2));
    toast('Copied', 'Submission shape copied to clipboard.', 'info');
  };
  const bar = (pct, delay) => (
    <div className="h-2.5 rounded-full bg-slate-100 overflow-hidden">
      <M from={{width:'0%'}} to={{width:pct+'%'}} dur={1.1} delay={delay}
        className="h-full rounded-full bg-gradient-to-r from-ai-500 via-brand-500 to-aqua-400"/>
    </div>
  );

  // Present the same 3-bar / ring / category-badge layout in all three modes,
  // just fed from different (truthful) numbers.
  const view = mode === 'scored' && scoreData ? {
    ringLabel: 'Score', ringValue: scoreData.final_score * 100,
    title: `Live run \u00b7 ${scoreData.n_emails} emails scored`,
    subtitle: 'Weighted composite of classification accuracy, defect detection and human-review reliability \u2014 scored by the organizers\u2019 reference server.',
    badge: null,
    bars: [
      ['Email classification', scoreData.stage1.macro_f1 * 100],
      ['Defect detection', scoreData.stage3.defect_f1 * 100],
      ['Review reliability', scoreData.reliability.escalation_f1 * 100],
    ],
    categories: Object.keys(CATEGORIES).map(c => {
      const per = (scoreData.stage1.per || {})[c] || { tp:0, fp:0, fn:0 };
      return [c, Math.round(prf(per.tp, per.fp, per.fn).f * 100)];
    }),
  } : mode === 'local' && localSummary ? {
    ringLabel: 'Processed', ringValue: localSummary.processedRate * 100,
    title: `Local run \u00b7 ${localSummary.total} emails`,
    subtitle: 'No reference server reachable, so this is a summary of what the pipeline actually decided \u2014 not an accuracy score (there\u2019s no ground truth on this machine to score against).',
    badge: { icon:'alertTriangle', text:'Reference server unreachable' },
    bars: [
      ['BL comparisons processed', localSummary.blTotal ? 100 : 0],
      ['Mismatches flagged', localSummary.defectRate * 100],
      ['Escalated for review', localSummary.reviewRate * 100],
    ],
    categories: Object.entries(localSummary.byCategory).map(([c, n]) => [c, n]),
    categoriesAreCounts: true,
  } : {
    ringLabel: 'Score', ringValue: EVAL_SCORES.overall,
    title: 'Submission v5 \u00b7 dataset v2.3',
    subtitle: 'Weighted composite of classification accuracy, defect detection and human-review reliability.',
    badge: null,
    bars: [
      ['Email classification', EVAL_SCORES.classification],
      ['Defect detection', EVAL_SCORES.defects],
      ['Review reliability', EVAL_SCORES.review],
    ],
    categories: [['BL_COMPARISON',91],['SI_REQUEST',96],['INVOICE',94],['GENERAL',90],['SPAM',97]],
  };


  return (
    <div className="space-y-5">
      <div className="flex flex-wrap items-end justify-between gap-4">
        <div className="min-w-0">
          <h1 className="font-display text-[26px] font-bold text-navy-900 tracking-tight">Evaluation</h1>
          <p className="text-sm text-slate-400 mt-1">Score your submission against the hackathon reference set</p>
        </div>
        <button className="btn-primary" onClick={run} disabled={phase === 'run'}>
          {phase === 'run' ? <Icon name="loader" size={15} className="animate-spin"/> : <Icon name="play" size={14}/>}
          {phase === 'run' ? 'Running…' : 'Run Evaluation'}
        </button>
      </div>

      <div className="grid grid-cols-1 xl:grid-cols-12 gap-5 items-start">
        <div className="xl:col-span-7">
          {phase === 'run' ? (
            <M from={{opacity:0, y:18}} to={{opacity:1, y:0}} className="card p-8">
              <div className="flex flex-col items-center text-center">
                <LoadingAnimation size={64}/>
                <h3 className="font-display text-lg font-bold text-navy-900 mt-5">Evaluating submission…</h3>
                <p className="text-[12.5px] text-slate-400 mt-1">The full pipeline is replaying against the reference set</p>
              </div>
              <div className="mt-7 space-y-1">
                {EVAL_STEPS.map((s, i) => {
                  const state = step > i ? 'done' : step === i ? 'busy' : 'wait';
                  return (
                    <div key={i} className={cx('flex items-center gap-3.5 rounded-xl px-4 py-3 transition-colors', state === 'busy' && 'bg-brand-50/70')}>
                      <span className={cx('w-8 h-8 rounded-lg flex items-center justify-center shrink-0',
                        state === 'done' ? 'bg-emerald-50 text-emerald-600' : state === 'busy' ? 'bg-brand-100 text-brand-600' : 'bg-slate-50 text-slate-300')}>
                        {state === 'done' ? <Icon name="check" size={14} strokeWidth={2.6}/>
                          : <Icon name={s.icon} size={14} className={state === 'busy' ? 'animate-pulse' : ''}/>}
                      </span>
                      <div className="flex-1 min-w-0">
                        <div className={cx('text-[13px] font-bold truncate', state === 'wait' ? 'text-slate-300' : 'text-ink-800')}>{s.label}</div>
                        <div className="text-[11px] text-slate-400 truncate">{s.sub}</div>
                      </div>
                      {state === 'busy' && <Icon name="loader" size={15} className="text-brand-500 animate-spin shrink-0"/>}
                    </div>
                  );
                })}
              </div>
              <div className="mt-6">
                <div className="h-2 rounded-full bg-slate-100 overflow-hidden">
                  <div className="h-full rounded-full bg-gradient-to-r from-ai-500 to-aqua-400 transition-all duration-500"
                    style={{ width: `${Math.min(100, (step / EVAL_STEPS.length) * 100)}%` }}/>
                </div>
              </div>
            </M>
          ) : (
            <M from={{opacity:0, y:18}} to={{opacity:1, y:0}} className="card overflow-hidden" key={phase}>
              <div className="relative p-7 text-white overflow-hidden" style={{ background:'linear-gradient(120deg,#0A1A2F,#172E6E 55%,#4C1D95 110%)' }}>
                <div className="absolute -right-16 -top-16 w-64 h-64 rounded-full bg-ai-500/20 blur-3xl animate-drift pointer-events-none"/>
                <div className="relative flex flex-col md:flex-row items-center gap-7">
                  <div className="shrink-0">
                    <Ring value={view.ringValue} size={172} thickness={14} from="#A78BFA" to="#22D3EE" track="rgba(255,255,255,.12)" delay={phase === 'done' ? 200 : 500}>
                      {(v) => (<>
                        <div className="font-display text-[35px] font-bold leading-none tabular-nums">{v.toFixed(1)}<span className="text-[19px] opacity-60">%</span></div>
                        <div className="text-[10px] font-bold tracking-[0.14em] uppercase opacity-60 mt-1.5">{view.ringLabel}</div>
                      </>)}
                    </Ring>
                  </div>
                  <div className="text-center md:text-left min-w-0">
                    <div className="inline-flex items-center gap-2 rounded-full bg-white/10 border border-white/15 px-3 py-1.5">
                      <Icon name={view.badge ? 'alertTriangle' : 'gauge'} size={13} className={cx('shrink-0', view.badge ? 'text-amber-300' : 'text-aqua-300')}/>
                      <span className={cx('text-[10.5px] font-bold tracking-wide uppercase whitespace-nowrap', view.badge ? 'text-amber-300' : 'text-aqua-300')}>
                        {view.badge ? view.badge.text : 'Hackathon Evaluation Score'}
                      </span>
                    </div>
                    <h2 className="font-display text-[24px] font-bold mt-3">{view.title}</h2>
                    <p className="text-white/55 text-[13px] leading-relaxed mt-1.5 max-w-sm">
                      {view.subtitle}
                    </p>
                    {mode === 'demo' && (
                      <div className="inline-flex items-center gap-1.5 mt-3 rounded-full bg-emerald-400/15 px-3 py-1.5 text-[12px] font-bold text-emerald-300 whitespace-nowrap">
                        <Icon name="trendingUp" size={13} className="shrink-0"/>+1.2 vs last run
                      </div>
                    )}
                  </div>
                </div>
              </div>
              <div className="p-6 space-y-5">
                {view.bars.map(([l, v], i) => (
                  <div key={l}>
                    <div className="flex items-center justify-between mb-2 gap-3">
                      <span className="text-[13px] font-semibold text-ink-700 truncate">{l}</span>
                      <span className="font-display text-[15px] font-bold text-navy-900 tabular-nums shrink-0">{v.toFixed(1)}%</span>
                    </div>
                    {bar(v, [.15,.28,.41][i])}
                  </div>
                ))}
                <div className="flex flex-wrap gap-2 pt-1">
                  {view.categories.map(([c,v]) => (
                    <span key={c} className="inline-flex items-center gap-1.5 rounded-full bg-slate-50 border border-slate-200 px-3 py-1.5 text-[11.5px] font-bold text-ink-700 whitespace-nowrap">
                      <span className="w-1.5 h-1.5 rounded-full shrink-0" style={{ background: view.categoriesAreCounts ? '#2563EB' : (v >= 93 ? '#10B981' : '#2563EB') }}/>
                      {c} · {v}{view.categoriesAreCounts ? '' : '%'}
                    </span>
                  ))}
                </div>
              </div>
            </M>
          )}
        </div>

        <div className="xl:col-span-5 space-y-5">
          <M from={{opacity:0, y:18}} to={{opacity:1, y:0}} delay={.12} className="card overflow-hidden">
            <div className="flex items-center justify-between gap-3 px-5 py-3.5 bg-navy-950">
              <span className="flex items-center gap-2 text-[12px] font-bold text-slate-300 font-mono min-w-0">
                <Icon name="database" size={13} className="text-aqua-400 shrink-0"/><span className="truncate">submission.json</span>
              </span>
              <span className="rounded-md bg-white/10 px-2 py-0.5 text-[10px] font-bold text-slate-400 shrink-0">
                {submissionData ? `${Object.keys(submissionData).length} emails` : 'v5'}
              </span>
            </div>
            <div className="p-5 bg-navy-900 text-slate-300">
              {submissionData ? <LiveSubmissionPreview data={submissionData}/> : <SubmissionPreview/>}
            </div>
            <div className="flex items-center gap-2.5 p-4 border-t border-slate-100">
              <button className="btn-primary btn-sm flex-1" onClick={download}><Icon name="download" size={14}/>Download</button>
              <button className="btn-ghost btn-sm flex-1" onClick={copy}><Icon name="files" size={14}/>Copy shape</button>
            </div>
          </M>
          <M from={{opacity:0, y:18}} to={{opacity:1, y:0}} delay={.2} className="card p-5">
            <h3 className="font-bold text-[14.5px] text-navy-900 mb-1">Score history</h3>
            <p className="text-[11.5px] text-slate-400 mb-3">Last 6 evaluation runs</p>
            <div className="h-36"><ChartCanvas build={buildHistory}/></div>
          </M>
        </div>

      </div>
    </div>
  );
}

              <option>{PRODUCT.engine} (Vision + OCR)</option><option>NOOUTPUT Engine v2.0</option><option>Hybrid · Rules + NLP fallback</option>

          <div className="rounded-2xl bg-slate-50/80 border border-slate-100 p-4 mb-2">
            <div className="flex items-center justify-between gap-3 mb-2">

          </div>
          <div>
            <SettingRow title="Auto-release verified comparisons" desc="Emails scoring OK on all seven fields skip the review queue." on={settings.autoRelease} onChange={v => setS({ autoRelease:v })}/>

            <Icon name="bell" size={16} className="text-amber-500 shrink-0"/>Notifications
          </h3>
          <SettingRow title="Mismatch alerts" desc="Notify me the moment a defect is detected." on={settings.nMismatch} onChange={v => setS({ nMismatch:v })}/>
          <SettingRow title="Review reminders" desc="Ping me when a case sits in the queue over 2 hours." on={settings.nReview} onChange={v => setS({ nReview:v })}/>
          <SettingRow title="Weekly digest" desc="Summary of throughput, defects and scores every Monday." on={settings.nDigest} onChange={v => setS({ nDigest:v })}/>
        </M>

        <M from={{opacity:0, y:16}} to={{opacity:1, y:0}} delay={.2} className="card p-6">
          <h3 className="font-bold text-[15px] text-navy-900 mb-4 flex items-center gap-2">
            <Icon name="database" size={16} className="text-aqua-600 shrink-0"/>Data controls
          </h3>
          <div className="grid grid-cols-3 gap-3 mb-5">
            {[['Emails', emails.length],['Open cases', reviews.length],['Eval runs', 6]].map(([l,v]) => (
              <div key={l} className="rounded-xl bg-slate-50/80 border border-slate-100 p-3 text-center">
                <div className="font-display text-xl font-bold text-navy-900">{v}</div>
                <div className="text-[10.5px] text-slate-400 font-semibold uppercase tracking-wide mt-0.5 truncate">{l}</div>
              </div>
            ))}

          <div className="space-y-2.5">
            <button className="btn-ghost w-full" onClick={() => {
              const blob = new Blob([JSON.stringify(emails, null, 2)], { type:'application/json' });
              const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'nooutput_export.json'; a.click();
              URL.revokeObjectURL(a.href);
              toast('Export ready', 'nooutput_export.json downloaded.', 'success');
            }}><Icon name="download" size={14}/>Export all data (JSON)</button>
            <button className={cx('w-full', confirmReset ? 'btn-danger-o' : 'btn-ghost')} style={confirmReset ? {} : { color:'#DC2626' }}
              onClick={() => { if (!confirmReset) { setConfirmReset(true); return; } resetDemo(); setConfirmReset(false); }}>
              <Icon name="refresh" size={14}/>{confirmReset ? 'Click again to confirm reset' : 'Reset demo data'}
            </button>

        </M>
      </div>
    </div>
  );
}

function UploadModal({ open, onClose }) {
  const [phase, setPhase] = useState('idle');
  const [pct, setPct] = useState(0);
  useEffect(() => { if (!open) { setPhase('idle'); setPct(0); } }, [open]);
  useEffect(() => {
    if (phase !== 'uploading') return;
    const t = setInterval(() => setPct(p => {
      const n = p + 4 + Math.random()*7;
      if (n >= 100) { clearInterval(t); setTimeout(() => setPhase('done'), 350); return 100; }
      return n;
    }), 130);
    return () => clearInterval(t);
  }, [phase]);
  if (!open) return null;
  const stage = pct < 35 ? 'Extracting inbox bundle…' : pct < 70 ? 'Indexing emails & attachments…' : 'Queueing AI classification…';
  return (
    <div className="fixed inset-0 z-[70] flex items-center justify-center p-4">
      <div className="absolute inset-0 bg-navy-950/55 backdrop-blur-sm" onClick={onClose}/>
      <M from={{opacity:0, transform:'scale(.94) translateY(14px)'}} to={{opacity:1, transform:'none'}} dur={.3} className="relative card w-full max-w-lg p-6 shadow-lift">
        <div className="flex items-center justify-between mb-5">
          <h3 className="font-display font-bold text-[17px] text-navy-900">Upload dataset</h3>
          <button onClick={onClose} className="w-8 h-8 rounded-lg hover:bg-slate-100 flex items-center justify-center text-slate-400"><Icon name="x" size={16}/></button>
        </div>
        {phase === 'done' ? (
          <div className="py-6 flex flex-col items-center text-center animate-popIn">
            <div className="w-16 h-16 rounded-full bg-emerald-50 text-emerald-500 flex items-center justify-center"><Icon name="checkCircle" size={30}/></div>
            <h4 className="font-display font-bold text-navy-900 text-lg mt-4">Ingestion complete</h4>
            <p className="text-[13px] text-slate-400 mt-1.5">14 emails and 23 attachments queued. The AI pipeline is processing now.</p>
            <button className="btn-primary mt-6" onClick={onClose}>Done</button>
          </div>
        ) : phase === 'uploading' ? (
          <div className="py-4">
            <div className="flex items-center gap-4">
              <LoadingAnimation size={48}/>
              <div className="flex-1 min-w-0">
                <div className="text-[13.5px] font-bold text-ink-800">{stage}</div>
                <div className="font-mono text-[12px] text-slate-400 mt-0.5">{Math.round(pct)}% · inbox_2026W38.zip</div>
              </div>
            </div>
            <div className="mt-5 h-2.5 rounded-full bg-slate-100 overflow-hidden">
              <div className="h-full rounded-full bg-gradient-to-r from-brand-500 to-aqua-400 transition-all duration-150" style={{ width:pct+'%' }}/>
            </div>
          </div>
        ) : (
          <>
            <label className="block cursor-pointer rounded-2xl border-2 border-dashed border-brand-200 bg-brand-50/40 hover:bg-brand-50/80 hover:border-brand-400 transition-all p-10 text-center">
              <input type="file" className="hidden" onChange={() => setPhase('uploading')}/>
              <div className="w-14 h-14 mx-auto rounded-2xl bg-white shadow-card flex items-center justify-center text-brand-500"><Icon name="upload" size={24}/></div>
              <div className="font-bold text-ink-800 mt-4">Drop inbox.zip here, or browse</div>
              <div className="text-[12px] text-slate-400 mt-1">Bundle: inbox/ · attachments/ · sample_submission.json · loader.py</div>
            </label>
            <div className="flex items-center gap-3 mt-4">
              <button className="btn-ghost flex-1" onClick={() => setPhase('uploading')}><Icon name="zap" size={14}/>Use demo dataset</button>
              <span className="text-[11px] text-slate-400 flex-1 text-right font-mono">POST /upload</span>
            </div>
          </>
        )}
      </M>
    </div>
  );
}

const AppCtx = createContext(null);
const useApp = () => useContext(AppCtx);
const PROFILE_NAME = 'Amelia Rahman';

/* ================================================================
   Live backend wiring
   ------------------------------------------------------------------
   Everything above this point is the original self-contained demo
   (mock data + full UI). Below, we optionally hydrate that same UI
   shape from the real FastAPI backend. If the backend can't be
   reached, the app quietly keeps running on the bundled demo data —
   a live-demo booth should never show a broken screen.
   ================================================================ */
const API_BASE = (window.API_BASE_URL || 'http://localhost:8000').replace(/\/$/, '');

const DB_FIELD_MAP = { port_of_loading: 'port_loading', port_of_discharge: 'port_discharge', gross_weight_kg: 'gross_weight' };
function dbKey(f) { return DB_FIELD_MAP[f] || f; }

async function apiLogin(user, pass) {
  const res = await fetch(API_BASE + '/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: user, password: pass }),
  });
  if (!res.ok) throw new Error('login failed');
  return res.json(); // { token, username }
}

async function apiFetchFullEmails(token) {
  const res = await fetch(API_BASE + '/emails/full', { headers: { Authorization: 'Bearer ' + token } });
  if (!res.ok) throw new Error('failed to load emails from backend');
  return res.json();
}

async function apiPost(path, token, body) {
  const res = await fetch(API_BASE + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    let detail = '';
    try { detail = (await res.json()).detail || ''; } catch {}
    throw new Error(detail || `${path} failed (${res.status})`);
  }
  return res.json();
}

async function apiGet(path, token) {
  const res = await fetch(API_BASE + path, { headers: { Authorization: 'Bearer ' + token } });
  if (!res.ok) throw new Error(`${path} failed (${res.status})`);
  return res.json();
}

function prf(tp, fp, fn) {
  const p = (tp + fp) ? tp / (tp + fp) : 0;
  const r = (tp + fn) ? tp / (tp + fn) : 0;
  const f = (p + r) ? 2 * p * r / (p + r) : 0;
  return { p, r, f };
}

function buildLocalSummary(emails) {
  const total = emails.length;
  const processed = emails.filter(e => e.status && e.status !== 'PROCESSING').length;
  const blEmails = emails.filter(e => e.category === 'BL_COMPARISON');
  const mismatches = blEmails.filter(e => e.status === 'MISMATCH').length;
  const ok = blEmails.filter(e => e.status === 'OK').length;
  const reviews = emails.filter(e => e.status === 'NEEDS_REVIEW').length;
  const byCategory = {};
  emails.forEach(e => { if (e.category) byCategory[e.category] = (byCategory[e.category] || 0) + 1; });
  const confidences = emails.map(e => e.conf || 0).filter(v => v > 0);
  const avgConfidence = confidences.length ? confidences.reduce((a, b) => a + b, 0) / confidences.length : 0;
  return {
    total, processed,
    processedRate: total ? processed / total : 0,
    blTotal: blEmails.length, mismatches, reviews, ok,
    defectRate: blEmails.length ? mismatches / blEmails.length : 0,
    reviewRate: blEmails.length ? reviews / blEmails.length : 0,
    avgConfidence, byCategory,
  };
}

function fmtDateTime(iso) {
  try {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return { date: '', time: '' };
    return {
      date: d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
      time: d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false }),
    };
  } catch { return { date: '', time: '' }; }
}

function findDocByType(documents, type) {
  return documents.find(d => d.document_type === type)
    || documents.find(d => (d.filename || '').toUpperCase().includes('_' + type));
}

function mapFieldsToSiBl(fields) {
  if (!fields) return null;
  const out = {};
  FIELDS.forEach(f => { out[f.key] = fields[dbKey(f.key)] ?? null; });
  return out;
}

function mapAttachment(d) {
  const fieldEntries = d.fields ? Object.entries(d.fields).filter(([, v]) => v !== null && v !== undefined) : [];
  const excerpt = fieldEntries.map(([k, v]) => `${k.toUpperCase()}: ${v}`);
  return doc(d.filename, d.document_type || 'DOC', '', fieldEntries.length, d.readable ? 'extracted' : 'failed', excerpt);
}

function buildEvidence(defectFields, siDoc, blDoc) {
  const evidence = [];
  (defectFields || []).forEach(f => {
    const label = fieldLabel(f);
    if (siDoc && siDoc.fields) evidence.push({ field: f, doc: 'SI', text: `${label.toUpperCase()}: ${valFmt(f, siDoc.fields[dbKey(f)])}` });
    if (blDoc && blDoc.fields) evidence.push({ field: f, doc: 'BL', text: `${label.toUpperCase()}: ${valFmt(f, blDoc.fields[dbKey(f)])}` });
  });
  return evidence;
}

function mapBackendEmailToUi(e) {
  const { date, time } = fmtDateTime(e.created_at);
  const documents = e.documents || [];
  const siDoc = findDocByType(documents, 'SI');
  const blDoc = findDocByType(documents, 'BL');
  const cmp = e.comparison;
  const defectFields = (cmp && cmp.defect_fields) || [];
  const isPending = e.status === 'PENDING' || e.status === 'PROCESSING';
  const status = e.category === 'BL_COMPARISON'
    ? (cmp ? cmp.status : (isPending ? 'PROCESSING' : 'NEEDS_REVIEW'))
    : (isPending ? 'PROCESSING' : 'PROCESSED');
  return {
    id: e.email_id,
    subject: e.subject,
    sender: e.from,
    from: e.from,
    category: e.category,
    status,
    conf: e.classification_confidence ?? 0,
    date, time,
    body: e.body,
    atts: documents.map(mapAttachment),
    defectFields,
    reviewReason: cmp ? cmp.review_reason : null,
    si: mapFieldsToSiBl(siDoc && siDoc.fields),
    bl: mapFieldsToSiBl(blDoc && blDoc.fields),
    evidence: buildEvidence(defectFields, siDoc, blDoc),
  };
}

function reviewCaseFromEmail(email) {
  const reason = email.reviewReason || 'manual';
  const reasonMeta = REASONS[reason] || REASONS.manual;
  const fieldsForEdit = email.defectFields.length ? email.defectFields : FIELDS.map(f => f.key);
  return {
    id: 'R-' + email.id,
    emailId: email.id,
    reason,
    confidence: Math.round((email.conf || 0) * 100),
    received: email.time || '',
    summary: `${reasonMeta.label}. ` + (email.defectFields.length
      ? `Affected fields: ${email.defectFields.map(fieldLabel).join(', ')}.`
      : 'Please verify against the source documents before releasing.'),
    suggestion: 'Verify against the source documents, then approve or correct.',
    editFields: fieldsForEdit.map(f => ({
      key: f, label: fieldLabel(f),
      si: valFmt(f, email.si ? email.si[f] : null),
      bl: valFmt(f, email.bl ? email.bl[f] : null),
      value: String(email.si ? (email.si[f] ?? '') : ''),
    })),
    evidence: email.evidence && email.evidence.length
      ? email.evidence
      : [{ doc: 'AI', tone: 'warn', lines: ['See source documents for details — ' + reasonMeta.label + '.'] }],
    timeline: [
      { t: email.time, label: 'Email received', icon: 'mail', state: 'done' },
      { t: '', label: 'AI processed — ' + email.category, icon: 'sparkles', state: 'done' },
      { t: '', label: 'Issue detected — ' + reason, icon: 'alertTriangle', state: 'done' },
      { t: '', label: 'Waiting for reviewer', icon: 'clock', state: 'active' },
    ],
  };
}

function App() {
  const [authed, setAuthed] = useState(false);
  const [authToken, setAuthToken] = useState(null);
  const [liveMode, setLiveMode] = useState(false);
  const [route, setRoute] = useState({ page:'dashboard', id:null });
  const [emails, setEmails] = useState(clone(initialEmails));
  const [reviews, setReviews] = useState(clone(initialReviews));
  const [toasts, setToasts] = useState([]);
  const [uploadOpen, setUploadOpen] = useState(false);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [searchSeed, setSearchSeed] = useState('');
  const [settings, setSettings] = useState({ model:PRODUCT.engine, threshold:70, autoRelease:true, semantic:true, ocr:true, nMismatch:true, nReview:true, nDigest:false });

  const toast = (title, desc, type='info') => {
    const id = Math.random();
    setToasts(t => [...t, { id, title, desc, type }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3900);
  };
  const dismissToast = (id) => setToasts(t => t.filter(x => x.id !== id));
  const updateEmail = (id, patch) => setEmails(list => list.map(e => e.id === id ? { ...e, ...patch } : e));
  const addReview = (email) => {
    setReviews(r => [...r, {
      id: String(108 + r.length), emailId: email.id, reason:'manual', confidence: Math.round(email.conf*100), received:'now',
      summary: `Reviewer escalation on ${email.id}. Defect fields: ${email.defectFields.map(fieldLabel).join(', ') || 'none'}. Confirm or correct the AI result.`,
      suggestion:'Verify against the source documents, then approve or correct.',
      editFields: email.defectFields.map(f => ({ key:f, label:fieldLabel(f), si: valFmt(f, email.si ? email.si[f] : null), bl: valFmt(f, email.bl ? email.bl[f] : null), value: String(email.si ? (email.si[f] ?? '') : '') })),
      evidence: (email.evidence || [{ doc:'AI', tone:'warn', lines:['Escalated manually by ' + PROFILE_NAME] }]),
      timeline: [
        { t: email.time, label:'Email received', icon:'mail', state:'done' },
        { t:'', label:'AI processed — ' + email.category, icon:'sparkles', state:'done' },
        { t:'', label:'Escalated by reviewer', icon:'userCheck', state:'done' },
        { t:'', label:'Waiting for decision', icon:'clock', state:'active' },
      ],
    }]);
    toast('Sent to review', email.id + ' added to the human review queue.', 'warn');
  };
  const navigate = (page, id=null) => { setRoute({ page, id }); setSidebarOpen(false); };
  const resetDemo = () => { setEmails(clone(initialEmails)); setReviews(clone(initialReviews)); toast('Demo reset', 'All emails, cases and settings restored.', 'info'); };
  const restoreReviews = () => setReviews(clone(initialReviews));

  useEffect(() => {
    if (!authed || !authToken) return;
    let cancelled = false;
    apiFetchFullEmails(authToken)
      .then(data => {
        if (cancelled) return;
        const mapped = data.map(mapBackendEmailToUi);
        setEmails(mapped);
        setReviews(mapped.filter(e => e.status === 'NEEDS_REVIEW').map(reviewCaseFromEmail));
        setLiveMode(true);
        toast('Connected to backend', `Loaded ${mapped.length} emails from the live API.`, 'success');
      })
      .catch(() => {
        if (cancelled) return;
        toast('Offline demo mode', 'Could not reach the backend at ' + API_BASE + ' — showing sample data instead.', 'info');
      });
    return () => { cancelled = true; };
  }, [authed, authToken]);

  const ctx = { emails, reviews, settings, setSettings, toast, dismissToast, updateEmail, addReview, navigate, resetDemo, restoreReviews, setReviews, openUpload:() => setUploadOpen(true), searchSeed, setSearchSeed, liveMode, authToken };

  if (!authed) return <LoginPage onLogin={(token) => { setAuthToken(token || null); setAuthed(true); }}/>;

  const PAGES = {
    dashboard: <DashboardPage/>,
    emails: <EmailsPage/>,
    detail: <EmailDetailPage id={route.id}/>,
    reviews: <ReviewsPage/>,
    evaluation: <EvaluationPage/>,
    settings: <SettingsPage/>,
  };

  return (
    <AppCtx.Provider value={ctx}>
      <div className="h-screen flex flex-col bg-ink-50">
        <Topbar route={route.page} onMenu={() => setSidebarOpen(true)} onLogout={() => setAuthed(false)}/>
        <div className="flex flex-1 min-h-0">
          <aside className="hidden lg:flex flex-col w-[248px] shrink-0 border-r border-slate-200/70 bg-white">
            <SidebarContent route={route.page} navigate={navigate}/>
          </aside>
          {sidebarOpen && <>
            <div className="fixed inset-0 bg-navy-950/45 backdrop-blur-sm z-40 lg:hidden" onClick={() => setSidebarOpen(false)}/>
            <aside className="fixed inset-y-0 left-0 z-50 w-[264px] bg-white shadow-lift lg:hidden">
              <SidebarContent route={route.page} navigate={navigate}/>
            </aside>
          </>}
          <main className="flex-1 min-w-0 overflow-y-auto">
            <div key={route.page + ':' + (route.id || '')} className="p-4 lg:p-7 max-w-[1440px] mx-auto">
              <div className="animate-pageIn">{PAGES[route.page]}</div>
            </div>
          </main>
        </div>
        <UploadModal open={uploadOpen} onClose={() => setUploadOpen(false)}/>
        <Toaster toasts={toasts} dismiss={dismissToast}/>
      </div>
    </AppCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
